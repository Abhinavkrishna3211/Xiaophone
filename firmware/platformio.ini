[env:xiao_esp32s3_plus]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino, espidf
monitor_speed = 115200

; XIAO ESP32S3 Plus: 16 MB flash, 8 MB OPI PSRAM
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; certificates the Arduino ESP-IDF component expects to be embedded
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.4
    bitbank2/JPEGDEC@1.8.4
    bblanchon/ArduinoJson@7.4.2
    lovyan03/LovyanGFX@1.2.36
